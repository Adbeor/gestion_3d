<!DOCTYPE html>
{% load static %}
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D TEC - Gestión</title>
    <link rel="stylesheet" href="{% static 'inventario/css/styles.css' %}">
    <style>
        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="{% url 'dashboard' %}" class="navbar-brand">
            🚀 3D TEC
        </a>

        <div class="navbar-menu">
            <a href="{% url 'dashboard' %}" class="nav-link">📊 Inicio</a>
            
            <a href="{% url 'kanban_ventas' %}" class="nav-link link-ventas">💰 Ventas</a>
            <a href="{% url 'kanban_taller' %}" class="nav-link link-taller">🔨 Taller</a>
            <a href="{% url 'kanban_proyectos' %}" class="nav-link link-proy">🧪 Laboratorio</a>
            <a href="{% url 'gestion_filamentos' %}" class="nav-link" style="border-bottom: 2px solid #95a5a6;">🧵 Filamentos</a>
            <a href="{% url 'gestion_insumos' %}" class="nav-link" style="border-bottom: 2px solid #7f8c8d;">📦 Insumos</a>
            
            <a href="{% url 'lista_pedidos' %}" class="nav-link">📋 Historial</a>
            <a href="{% url 'crear_pedido' %}" class="nav-link" style="background: #27ae60; color: white;">+ Nuevo</a>
        </div>
    </nav>

    <div class="container">
        {% if messages %}
            {% for message in messages %}
                <div style="background: #d4edda; color: #155724; padding: 15px; margin-bottom: 20px; border-radius: 5px; border: 1px solid #c3e6cb;">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}
        {% endblock %}
    </div>

    {% block extra_js %}{% endblock %}

</body>
</html>
